<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recept bewerken – MijnRecepten</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="Style.css">
</head>
<body>

<header class="site-header">
    <a href="#" class="logo">Mijn<span>Recepten</span></a>

    <nav class="main-nav" aria-label="Hoofdmenu">
        <a href="#" class="nav-link is-active">Recepten</a>
        <a href="#" class="nav-link">Favorieten</a>
        <a href="#" class="nav-link">Boodschappenlijst</a>
    </nav>

    <div class="header-tools">
        <input type="search" class="search" placeholder="Zoeken…" aria-label="Zoeken">
        <a href="#" class="circle-btn circle-btn--light" aria-label="Nieuw recept">+</a>
        <a href="#" class="circle-btn" aria-label="Mijn account">M</a>
    </div>
</header>

<main class="page">

    <form action="" method="post" enctype="multipart/form-data">

        <div class="page-head">
            <h1>Recept bewerken</h1>
            <div class="page-actions">
                <a href="#" class="btn btn--outline">Annuleren</a>
                <button type="submit" class="btn btn--solid">Opslaan</button>
            </div>
        </div>

        <div class="layout">

            <section class="col-left">

                <label class="upload" for="foto">
                    <span class="bowl" aria-hidden="true"></span>
                    <span class="upload-text">Foto uploaden</span>
                    <input type="file" id="foto" name="foto" accept="image/*" hidden>
                </label>

                <div class="field">
                    <label for="titel">Titel</label>
                    <input type="text" id="titel" name="titel">
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="bereidingstijd">Bereidingstijd</label>
                        <input type="text" id="bereidingstijd" name="bereidingstijd">
                    </div>
                    <div class="field">
                        <label for="porties">Porties</label>
                        <input type="text" id="porties" name="porties">
                    </div>
                </div>

                <div class="field">
                    <label for="categorie">Categorie</label>
                    <input type="text" id="categorie" name="categorie">
                </div>

            </section>

            <section class="col-right">

                <h2>Ingrediënten</h2>
                <ul class="rows">
                    <li class="row">
                        <input type="text" name="ingredienten[]" aria-label="Ingrediënt 1">
                        <button type="button" class="remove" aria-label="Ingrediënt 1 verwijderen">×</button>
                    </li>
                    <li class="row">
                        <input type="text" name="ingredienten[]" aria-label="Ingrediënt 2">
                        <button type="button" class="remove" aria-label="Ingrediënt 2 verwijderen">×</button>
                    </li>
                    <li class="row">
                        <input type="text" name="ingredienten[]" aria-label="Ingrediënt 3">
                        <button type="button" class="remove" aria-label="Ingrediënt 3 verwijderen">×</button>
                    </li>
                </ul>
                <button type="button" class="add-btn">+ ingrediënt</button>

                <h2 class="second-heading">Stappen</h2>
                <!-- <ol> zorgt voor automatische nummering via CSS counters -->
                <ol class="rows steps">
                    <li class="row">
                        <input type="text" name="stappen[]" aria-label="Stap 1">
                        <button type="button" class="remove" aria-label="Stap 1 verwijderen">×</button>
                    </li>
                    <li class="row">
                        <input type="text" name="stappen[]" aria-label="Stap 2">
                        <button type="button" class="remove" aria-label="Stap 2 verwijderen">×</button>
                    </li>
                </ol>
                <button type="button" class="add-btn">+ stap</button>

            </section>
        </div>

    </form>
</main>

</body>
</html>
